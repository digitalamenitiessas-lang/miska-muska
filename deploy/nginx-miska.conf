# Vhost de nginx para el bot de Miska Muska.
#
# Va como ARCHIVO NUEVO, sin editar ninguno de los que ya tenés:
#   sudo cp deploy/nginx-miska.conf /etc/nginx/sites-available/miska-bot
#   sudo ln -s /etc/nginx/sites-available/miska-bot /etc/nginx/sites-enabled/
#   sudo nginx -t          # <- SIEMPRE probar antes de recargar
#   sudo systemctl reload nginx
#
# El certificado, después de que el DNS apunte acá:
#   sudo certbot --nginx -d bot.miskamuska.com.ar
#
# `nginx -t` valida TODA la configuración: si tu setup actual está bien, un
# error ahí es de este archivo, y recargando nada se rompe.

server {
    listen 80;
    listen [::]:80;
    server_name bot.miskamuska.com.ar;

    # certbot reescribe esto a HTTPS. Mientras tanto, deja pasar el desafío ACME.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.miskamuska.com.ar;

    # certbot completa estas dos líneas.
    # ssl_certificate     /etc/letsencrypt/live/bot.miskamuska.com.ar/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bot.miskamuska.com.ar/privkey.pem;

    # El token del panel viaja en el query string del SSE (EventSource no puede
    # mandar encabezados). Sin esta línea quedaría escrito en el log de accesos.
    access_log /var/log/nginx/miska-bot.access.log combined;
    error_log  /var/log/nginx/miska-bot.error.log;

    # Los webhooks de Telegram y Meta son chicos; las imágenes que manda la
    # gente, no tanto.
    client_max_body_size 8m;

    # --- Stream de eventos del panel ---------------------------------------
    # Tiene que ir ANTES del location genérico.
    location /api/stream {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        # Sin esto nginx acumula la respuesta y el panel queda mudo: los eventos
        # llegan todos juntos al cerrar la conexión, o no llegan.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # El servidor manda un ping cada 25 s. El timeout tiene que superarlo
        # con margen, o nginx corta el stream cada dos por tres.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Todo lo demás: webhooks, API y salud -------------------------------
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
